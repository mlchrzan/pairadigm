name: Draft PDF
on:
  push:
    paths:
      - 'paper.md'

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install TeX dependencies
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-extra-utils texlive-latex-recommended
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          # This should be the path to the paper within your repo.
          paper-path: paper.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          # This is the output path where Pandoc will write the compiled
          # PDF. Note, this should be the same directory as the input
          # paper.md
          path: paper.pdf
      - name: Commit PDF to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add paper.pdf
          git diff --quiet && git diff --staged --quiet || git commit -m "Update PDF of the paper.pdf in the repo files"
          git push
